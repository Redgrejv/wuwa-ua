[project]
name = "wuwa-ua"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ctranslate2",
    "numpy",
    "opencv-python-headless",
    "pymorphy3",
    "pymorphy3-dicts-uk",
    "pytesseract",
    "requests",
    "sentencepiece",
]

[project.optional-dependencies]
dev = ["pytest"]
windows = ["mss", "pillow", "huggingface_hub", "pymorphy3", "pymorphy3-dicts-uk"]
linux = ["pygobject", "pycairo", "python-xlib"]

[project.scripts]
wuwa-ua = "wuwa_ua.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
